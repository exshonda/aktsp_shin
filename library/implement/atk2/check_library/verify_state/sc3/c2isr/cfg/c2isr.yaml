c2isr:
  property:
    cc:
    sc:
      - SC3
      - SC4
    si:
      - COS0409

  pre_condition:
    C2ISR1:
      type: C2ISR
      intno: AKTSP_INTNO_E
      intatr: AK_ENABLE
      iniintpri: 4
      rtnstat: AK_STOP
      relres:
        - ResourceA
        - ResourceB
      osap: TRUSTED_OSAP1
      accosap:
        - NON_TRUSTED_OSAP5
    C2ISR2:
      type: C2ISR
      intno: AKTSP_INTNO_F
      intatr: AK_ENABLE
      iniintpri: 3
      rtnstat: AK_STOP
      relres:
        - ResourceC
      osap: TRUSTED_OSAP2
    C2ISR3:
      type: C2ISR
      intno: AKTSP_INTNO_I
      intatr: AK_ENABLE
      iniintpri: 2
      rtnstat: AK_STOP
      relres:
        - ResourceA
      istksz: 256
      osap: TRUSTED_OSAP2
    ResourceA:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
    ResourceB:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
    ResourceC:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
      accosap:
        - NON_TRUSTED_OSAP5
# 以下，確認用オブジェクト
    TrustedTask:
      type: TASK
      tstat: RUNNING
      curpri: 5
      inipri: 5
      maxact: 1
      spolicy: AK_SCHFULL
      osap: TRUSTED_OSAP5
      relres:
        - ResourceC
    NonTrustedTask:
      type: TASK
      tstat: SUSPENDED
      inipri: 6
      maxact: 1
      spolicy: AK_SCHFULL
      osap: NON_TRUSTED_OSAP5
    TaskDummy1:
      type: TASK
      tstat: SUSPENDED
      inipri: 1
      spolicy: AK_SCHFULL
      maxact: 1
      relres:
        - ResourceB
      osap: TRUSTED_OSAP5
    VerifyTrustedFunction:
      type: TRUSTED_FUNCTION
      osap: TRUSTED_OSAP5
    C1ISR1:
      type: C1ISR
      intno: AKTSP_INTNO_B
      iniintpri: 7
      rtnstat: AK_STOP
      osap: TRUSTED_OSAP5
    PRETASK_HOOK1:
      type: PRETASK_HOOK
      hookstat: AK_STOP
    PROTECTION_HOOK1:
      type: PROTECTION_HOOK
      hookstat: AK_STOP
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
    POSTTASK_HOOK1:
      type: POSTTASK_HOOK
      hookstat: AK_STOP

  do:
    id: TrustedTask
    syssrv: ActivateTask(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
