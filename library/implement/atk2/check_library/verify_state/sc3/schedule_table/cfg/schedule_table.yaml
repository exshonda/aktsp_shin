      inipri: 10
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event2_6
      osap: NON_TRUSTED_OSAP1
    Task3_1:
      type: TASK
      tstat: SUSPENDED
      inipri: 8
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event3_1
      osap: TRUSTED_OSAP1
    Task3_2:
      type: TASK
      tstat: SUSPENDED
      inipri: 7
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event3_2
      osap: NON_TRUSTED_OSAP1
    Task3_3:
      type: TASK
      tstat: SUSPENDED
      inipri: 6
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
