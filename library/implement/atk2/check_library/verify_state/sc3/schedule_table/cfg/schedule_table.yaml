      inipri: 10
      maxact: 1
      spolicy: AK_SCHFULL
      osap: NON_TRUSTED_OSAP1
    Task2_1:
      type: TASK
      tstat: SUSPENDED
      inipri: 10
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event2_1
      osap: TRUSTED_OSAP1
