      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event2_3
      osap: TRUSTED_OSAP1
      accosap:
        - NON_TRUSTED_OSAP1
    Task2_4:
      type: TASK
      tstat: SUSPENDED
      inipri: 10
      maxact: 1
      spolicy: AK_SCHFULL
      relevt:
        - Event2_4
      osap: NON_TRUSTED_OSAP1
    Task2_5:
