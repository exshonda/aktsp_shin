      tstat: SUSPENDED
      inipri: 14
      maxact: 1
      spolicy: AK_SCHFULL
      osap: NON_TRUSTED_OSAP1
    Task1_3:
      type: TASK
      tstat: SUSPENDED
      inipri: 13
      maxact: 1
      spolicy: AK_SCHFULL
      osap: TRUSTED_OSAP1
    Task1_4:
      type: TASK
