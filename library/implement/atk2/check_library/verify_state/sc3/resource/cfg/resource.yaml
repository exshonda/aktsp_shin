resource:
  property:
    cc:
      - BCC2
      - ECC2
    sc:
      - SC3
      - SC4
    si:
      - COS0830
      - COS0827

  pre_condition:
    TaskStandardRes:
      type: TASK
      tstat: RUNNING
      curpri: 2
      inipri: 2
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResLock
      osap: TRUSTED_OSAP1
    TaskInternalRes:
      type: TASK
      tstat: SUSPENDED
      inipri: 9
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - InternalResLock
      osap: NON_TRUSTED_OSAP1
    TaskLinkedRes:
      type: TASK
      tstat: SUSPENDED
      inipri: 6
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResforLnk
      osap: TRUSTED_OSAP1
    TaskDummy1:
      type: TASK
      tstat: SUSPENDED
      inipri: 3
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResLock
      osap: NON_TRUSTED_OSAP1
    TaskDummy2:
      type: TASK
      tstat: SUSPENDED
      inipri: 5
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - InternalResLock
      osap: TRUSTED_OSAP1
    TaskDummy3:
      type: TASK
      tstat: SUSPENDED
      inipri: 7
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResforLnk
      osap: NON_TRUSTED_OSAP1
    TaskDummy4:
      type: TASK
      tstat: SUSPENDED
      inipri: 1
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResUnl
      osap: TRUSTED_OSAP1
    TaskDummy5:
      type: TASK
      tstat: SUSPENDED
      inipri: 1
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - StandardResUnl
      osap: NON_TRUSTED_OSAP1
    TaskDummy6:
      type: TASK
      tstat: SUSPENDED
      inipri: 1
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - InternalResUnl
      osap: TRUSTED_OSAP1
    TaskDummy7:
      type: TASK
      tstat: SUSPENDED
      inipri: 1
      maxact: 1
      spolicy: AK_SCHFULL
      relres:
        - InternalResUnl
      osap: NON_TRUSTED_OSAP1
    InternalResLock:
      type: RESOURCE
      resprop: AK_INTERNAL
      lockflg: AK_UNLOCK
      accosap:
        - NON_TRUSTED_OSAP1
    InternalResUnl:
      type: RESOURCE
      resprop: AK_INTERNAL
      lockflg: AK_UNLOCK
      accosap:
        - NON_TRUSTED_OSAP1
    StandardResLock:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
      accosap:
        - NON_TRUSTED_OSAP1
    StandardResUnl:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
    StandardResforLnk:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
    LinkedResLock:
      type: RESOURCE
      resprop: AK_LINKED
      linkres: StandardResforLnk
      lockflg: AK_UNLOCK
    LinkedResUnl:
      type: RESOURCE
      resprop: AK_LINKED
      linkres: StandardResUnl
      lockflg: AK_UNLOCK
# 以下，確認用オブジェクト
    VerifyTrustedFunction:
      type: TRUSTED_FUNCTION
      osap: TRUSTED_OSAP5
    C2ISR1:
      type: C2ISR
      intno: AKTSP_INTNO_F
      intatr: AK_ENABLE
      iniintpri: 3
      rtnstat: AK_STOP
      osap: TRUSTED_OSAP5
    C1ISR1:
      type: C1ISR
      intno: AKTSP_INTNO_B
      iniintpri: 7
      rtnstat: AK_STOP
      osap: TRUSTED_OSAP5
    PRETASK_HOOK1:
      type: PRETASK_HOOK
      hookstat: AK_STOP
    PROTECTION_HOOK1:
      type: PROTECTION_HOOK
      hookstat: AK_STOP
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
    POSTTASK_HOOK1:
      type: POSTTASK_HOOK
      hookstat: AK_STOP

  do:
    id: TaskStandardRes
    syssrv: ActivateTask(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
