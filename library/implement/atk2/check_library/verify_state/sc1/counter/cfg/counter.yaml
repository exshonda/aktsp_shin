counter:
  property:
    cc:
      - BCC2
      - ECC2
    sc:
      - SC1
      - SC2
    si:
      - OS399
      - COS3653

  pre_condition:
    TaskActTask:
      type: TASK
      tstat: SUSPENDED
      inipri: 6
      maxact: 1
      spolicy: AK_SCHFULL
    Counter1:
      type: COUNTER
      mincyc: 1
      maxval: 8
      curval: 0
      ctype: AK_SOFTWARE
    Counter2:
      type: COUNTER
      mincyc: 2
      maxval: 10
      curval: 0
      ctype: AK_SOFTWARE
    Counter3:
      type: COUNTER
      mincyc: 3
      maxval: 15
      curval: 0
      ctype: AK_SOFTWARE
    DUMMY_HARDWARE_COUNTER:
      type: COUNTER
      curval: 0
      ctype: AK_HARDWARE
    AlarmActTask:
      type: ALARM
      counter: Counter1
      astat: AK_UNSET
      almact: AK_ALM_ATSK
      task: TaskActTask
# 以下，確認用オブジェクト
    TaskVerify:
      type: TASK
      tstat: RUNNING
      curpri: 5
      inipri: 5
      maxact: 1
      spolicy: AK_SCHFULL
    C2ISR1:
      type: C2ISR
      intno: AKTSP_INTNO_F
      intatr: AK_ENABLE
      iniintpri: 3
      rtnstat: AK_STOP
    C1ISR1:
      type: C1ISR
      intno: AKTSP_INTNO_B
      iniintpri: 7
      rtnstat: AK_STOP
    AlarmVerify:
      type: ALARM
      counter: CounterVerify
      astat: AK_UNSET
      almact: AK_ALM_CBACK
      callback: AlarmCallBackVerify
    AlarmCallBackVerify:
      type: ALARM_CBACK
      cbstat: AK_STOP
    CounterVerify:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      ctype: AK_SOFTWARE
    PRETASK_HOOK1:
      type: PRETASK_HOOK
      hookstat: AK_STOP
    PROTECTION_HOOK1:
      type: PROTECTION_HOOK
      hookstat: AK_STOP
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
    POSTTASK_HOOK1:
      type: POSTTASK_HOOK
      hookstat: AK_STOP

  do:
    id: TaskVerify
    syssrv: ActivateTask(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
