      type: EVENT
      mask: 0x00000010
    EventC:
      type: EVENT
      mask: 0x00000100
    EventD:
      type: EVENT
      mask: 0x00001000
    EventE:
      type: EVENT
      mask: 0x00010000
    EventF:
      type: EVENT
      mask: 0x00100000
# 以下，確認用オブジェクト
    C2ISR1:
      type: C2ISR
      intno: AKTSP_INTNO_F
      intatr: AK_ENABLE
      iniintpri: 3
      rtnstat: AK_STOP
    C1ISR1:
      type: C1ISR
      intno: AKTSP_INTNO_B
      iniintpri: 7
      rtnstat: AK_STOP
    AlarmVerify:
      type: ALARM
      counter: CounterVerify
      astat: AK_UNSET
      almact: AK_ALM_CBACK
      callback: AlarmCallBackVerify
    AlarmCallBackVerify:
      type: ALARM_CBACK
      cbstat: AK_STOP
    CounterVerify:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      ctype: AK_SOFTWARE
    PRETASK_HOOK1:
      type: PRETASK_HOOK
      hookstat: AK_STOP
    PROTECTION_HOOK1:
      type: PROTECTION_HOOK
      hookstat: AK_STOP
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
    POSTTASK_HOOK1:
      type: POSTTASK_HOOK
      hookstat: AK_STOP
    APPLICATION_MODE1:
      type: APPLICATION_MODE
    APPLICATION_MODE2:
      type: APPLICATION_MODE
    APPLICATION_MODE3:
      type: APPLICATION_MODE

  do:
    id: TaskSus
    syssrv: ActivateTask(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
