Os:
  Os:
    OsInclude:
      OsIncludeFileName: out.h
    MainApp:
      DefinitionRef: OsAppMode
    OsOS:
      OsNumberOfCores: 2
      OsStackMonitoring: true
      OsUseGetServiceId: true
      OsUseParameterAccess: true
      OsStatus: EXTENDED
      OsScalabilityClass: SC3
      OsMemoryProtectionLevel: Level2
      OsViolationHandlingLevel: Level2
      OsHooks:
        OsErrorHook: true
        OsPostTaskHook: true
        OsPreTaskHook: true
        OsProtectionHook: true
        OsShutdownHook: true
        OsStartupHook: true
      OsHookStack_0:
        DefinitionRef: OsHookStack
        OsHookStackSize: AKTSP_HOOK_STACK_SIZE
        OsHookStackCoreAssignment: OS_CORE_ID_0
      OsHookStack_1:
        DefinitionRef: OsHookStack
        OsHookStackSize: AKTSP_HOOK_STACK_SIZE
        OsHookStackCoreAssignment: OS_CORE_ID_1
      OsOsStack_0:
        DefinitionRef: OsOsStack
        OsOsStackSize: AKTSP_OS_STACK_SIZE
        OsOsStackCoreAssignment: OS_CORE_ID_0
      OsOsStack_1:
        DefinitionRef: OsOsStack
        OsOsStackSize: AKTSP_OS_STACK_SIZE
        OsOsStackCoreAssignment: OS_CORE_ID_1
      OsNonTrustedHookStack_0:
        DefinitionRef: OsNonTrustedHookStack
        OsNonTrustedHookStackSize: AKTSP_NTHOOK_STACK_SIZE
        OsNonTrustedHookStackCoreAssignment: 0
      OsNonTrustedHookStack_1:
        DefinitionRef: OsNonTrustedHookStack
        OsNonTrustedHookStackSize: AKTSP_NTHOOK_STACK_SIZE
        OsNonTrustedHookStackCoreAssignment: 1
    OsLinkSection:
      OsLinkSectionName: .stack_section
      OsLinkSectionMemoryRegionRef: /Os/Os/RAM
    MainTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 0
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
      OsTaskResourceRef: /Os/Os/DummyResource
      OsTaskEventRef: /Os/Os/DummyEvent
      OsTaskAutostart:
        OsTaskAppModeRef: /Os/Os/MainApp
    DummyTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 15
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
      OsTaskResourceRef: /Os/Os/DummyResource
    RunTask1:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 2
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSystemStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
    MainTask1:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 1
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSystemStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
      OsTaskAutostart:
        OsTaskAppModeRef: /Os/Os/MainApp
    RunTask0:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 2
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSystemStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
    DummyResource:
      DefinitionRef: OsResource
      OsResourceProperty: STANDARD
    DummyEvent:
      DefinitionRef: OsEvent
    TRUSTED_MAIN_OSAP:
      DefinitionRef: OsApplication
      OsApplicationCoreAssignment: OS_CORE_ID_0
      OsTrusted: true
      OsAppTaskRef:
        - /Os/Os/MainTask
        - /Os/Os/DummyTask
      OsApplicationHooks:
        OsAppErrorHook: false
        OsAppShutdownHook: false
        OsAppStartupHook: false
      AktspTfnActivateTask:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnActivateTask
      AktspTfnSetEvent:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnSetEvent
      AktspTfnShutdownOS:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnShutdownOS
      AktspTfnRaiseInterCoreInterrupt:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnRaiseInterCoreInterrupt
    TRUSTED_SUB_OSAP_1:
      DefinitionRef: OsApplication
      OsApplicationCoreAssignment: OS_CORE_ID_1
      OsTrusted: true
      OsApplicationHooks:
        OsAppErrorHook: false
        OsAppShutdownHook: false
        OsAppStartupHook: false
      AktspTfnActivateTask_1:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnActivateTask
      AktspTfnSetEvent_1:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnSetEvent
      AktspTfnShutdownOS_1:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnShutdownOS
      AktspTfnRaiseInterCoreInterrupt_1:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnRaiseInterCoreInterrupt
    NT_OSAP_OTHER_OTHER_CORE:
      DefinitionRef: OsApplication
      OsApplicationCoreAssignment: OS_CORE_ID_1
      OsTrusted: false
      OsAppTaskRef:
        - /Os/Os/RunTask1
        - /Os/Os/MainTask1
      OsApplicationHooks:
        OsAppErrorHook: true
        OsAppShutdownHook: true
        OsAppStartupHook: true
    NT_OSAP_SELF_CORE:
      DefinitionRef: OsApplication
      OsApplicationCoreAssignment: OS_CORE_ID_0
      OsTrusted: false
      OsAppTaskRef: /Os/Os/RunTask0
      OsApplicationHooks:
        OsAppErrorHook: true
        OsAppShutdownHook: true
        OsAppStartupHook: true
