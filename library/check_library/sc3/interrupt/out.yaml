Os:
  Os:
    OsInclude:
      OsIncludeFileName: out.h
    MainApp:
      DefinitionRef: OsAppMode
    OsOS:
      OsStackMonitoring: true
      OsUseGetServiceId: true
      OsUseParameterAccess: true
      OsStatus: EXTENDED
      OsScalabilityClass: SC3
      OsMemoryProtectionLevel: Level2
      OsViolationHandlingLevel: Level2
      OsHooks:
        OsErrorHook: true
        OsPostTaskHook: true
        OsPreTaskHook: true
        OsProtectionHook: true
        OsShutdownHook: true
        OsStartupHook: true
      OsHookStack:
        OsHookStackSize: AKTSP_HOOK_STACK_SIZE
      OsOsStack:
        OsOsStackSize: AKTSP_OS_STACK_SIZE
      OsNonTrustedHookStack:
        OsNonTrustedHookStackSize: AKTSP_NTHOOK_STACK_SIZE
    OsLinkSection:
      OsLinkSectionName: .stack_section
      OsLinkSectionMemoryRegionRef: /Os/Os/RAM
    MainTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 0
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
      OsTaskResourceRef: /Os/Os/DummyResource
      OsTaskEventRef: /Os/Os/DummyEvent
      OsTaskAutostart:
        OsTaskAppModeRef: /Os/Os/MainApp
    DummyTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 15
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
      OsTaskResourceRef: /Os/Os/DummyResource
    NonTrustedTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 6
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSystemStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
    AKTG_C1ISR_COMMON_AKTSP_INTNO_A:
      DefinitionRef: OsIsr
      OsIsrInterruptNumber: AKTSP_INTNO_A
      OsIsrInterruptPriority: AKTSP_INT_PRI_ISR1
      OsIsrCategory: CATEGORY_1
      OsIsrInterruptSource: ENABLE
    AKTG_C2ISR_COMMON_AKTSP_INTNO_B:
      DefinitionRef: OsIsr
      OsIsrInterruptNumber: AKTSP_INTNO_B
      OsIsrInterruptPriority: AKTSP_INT_PRI_HIGH
      OsIsrStackSize: AKTSP_C2ISR_STACK_SIZE
      OsIsrCategory: CATEGORY_2
      OsIsrInterruptSource: ENABLE
    AKTG_C2ISR_COMMON_AKTSP_INTNO_C:
      DefinitionRef: OsIsr
      OsIsrInterruptNumber: AKTSP_INTNO_C
      OsIsrInterruptPriority: AKTSP_INT_PRI_MID
      OsIsrStackSize: AKTSP_C2ISR_STACK_SIZE
      OsIsrCategory: CATEGORY_2
      OsIsrInterruptSource: ENABLE
    AKTG_C2ISR_COMMON_AKTSP_INTNO_D:
      DefinitionRef: OsIsr
      OsIsrInterruptNumber: AKTSP_INTNO_D
      OsIsrInterruptPriority: AKTSP_INT_PRI_LOW
      OsIsrStackSize: AKTSP_C2ISR_STACK_SIZE
      OsIsrCategory: CATEGORY_2
      OsIsrInterruptSource: ENABLE
    TrustedTask:
      DefinitionRef: OsTask
      OsTaskActivation: 1
      OsTaskPriority: 5
      OsTaskStackSize: AKTSP_TASK_STACK_SIZE
      OsTaskSchedule: FULL
    DummyResource:
      DefinitionRef: OsResource
      OsResourceProperty: STANDARD
    DummyEvent:
      DefinitionRef: OsEvent
    TRUSTED_MAIN_OSAP:
      DefinitionRef: OsApplication
      OsTrusted: true
      OsAppTaskRef:
        - /Os/Os/MainTask
        - /Os/Os/DummyTask
      OsApplicationHooks:
        OsAppErrorHook: false
        OsAppShutdownHook: false
        OsAppStartupHook: false
      AktspTfnActivateTask:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnActivateTask
      AktspTfnSetEvent:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnSetEvent
      AktspTfnShutdownOS:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_AktspTfnShutdownOS
    NON_TRUSTED_OSAP5:
      DefinitionRef: OsApplication
      OsTrusted: false
      OsAppTaskRef: /Os/Os/NonTrustedTask
      OsApplicationHooks:
        OsAppErrorHook: true
        OsAppShutdownHook: true
        OsAppStartupHook: true
    TRUSTED_OSAP1:
      DefinitionRef: OsApplication
      OsTrusted: true
      OsAppIsrRef:
        - /Os/Os/AKTG_C1ISR_COMMON_AKTSP_INTNO_A
        - /Os/Os/AKTG_C2ISR_COMMON_AKTSP_INTNO_B
        - /Os/Os/AKTG_C2ISR_COMMON_AKTSP_INTNO_C
        - /Os/Os/AKTG_C2ISR_COMMON_AKTSP_INTNO_D
      OsApplicationHooks:
        OsAppErrorHook: false
        OsAppShutdownHook: false
        OsAppStartupHook: false
    TRUSTED_OSAP5:
      DefinitionRef: OsApplication
      OsTrusted: true
      OsAppTaskRef: /Os/Os/TrustedTask
      OsApplicationHooks:
        OsAppErrorHook: true
        OsAppShutdownHook: true
        OsAppStartupHook: true
      VerifyTrustedFunction:
        DefinitionRef: OsApplicationTrustedFunction
        OsTrustedFunctionStackSize: AKTSP_STACK_SIZE_FOR_TFN
        OsTrustedFunctionName: TRUSTED_VerifyTrustedFunction
