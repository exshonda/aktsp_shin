      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_HIGH
      curevt : 0
      relevt:
        - EVENT1
    TASK2:
      type: TASK
      tstat  : READY
      curpri : TSK_PRI_MID
    EVENT1:
      type: EVENT
      actcnt: undefined

  do_0:
