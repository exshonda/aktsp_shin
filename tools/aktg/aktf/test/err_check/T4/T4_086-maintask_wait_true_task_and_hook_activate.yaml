T4_086_maintask_wait_true_task_and_hook_activate:
  property:
    maintask_wait: true
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type   : TASK
      tstat  : RUNNING
      curpri : 0

    TASK2:
      type   : TASK
      tstat  : READY
      curpri : 0

    POSTTASK_HOOK1:
      type: POSTTASK_HOOK
      hookstat: AK_ACTIVATE

    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_B
      iniintpri: INT_PRI_MID
      rtnstat: AK_STOP
      var:
        vname1:
          type: TaskType

  do:
    id     : POSTTASK_HOOK1
    syssrv : return

  post_condition:
    POSTTASK_HOOK1:
      hookstat: AK_STOP

    TASK1:
      tstat  : SUSPENDED

    TASK2:
      tstat  : RUNNING
