T4_OSAP_005_schedule_table_not_access_setevt:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      relevt:
        - EVENT1
      osap: TRUSTED_OSAP1
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      osap: TRUSTED_OSAP2
      accosap:
        - NON_TRUSTED_OSAP1
    TASK3:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      osap: TRUSTED_OSAP3
      accosap:
        - NON_TRUSTED_OSAP1
    TASK4:
      type: TASK
      tstat: READY
      curpri: TSK_PRI_LOW
      relevt:
        - EVENT2
      osap: TRUSTED_OSAP4
      accosap:
        - NON_TRUSTED_OSAP1
    SCHEDULE_TABLE1:
      type: SCHEDULE_TABLE
      counter: COUNTER1
      repeat: AK_TRUE
      duration: 20
      syncstrategy: AK_NONE
      ststat: SCHEDULETABLE_RUNNING
      curval: 3
      expoint:
        5:
          acttsk:
            - TASK2
          setevt:
            - TASK1: EVENT1
        10:
          acttsk:
            - TASK3
        15:
          setevt:
            - TASK4: EVENT2
      osap: NON_TRUSTED_OSAP1
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
      osap: NON_TRUSTED_OSAP1
    EVENT1:
      type: EVENT
    EVENT2:
      type: EVENT

  do:
    id: TASK1
    syssrv: StopScheduleTable(SCHEDULE_TABLE1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    SCHEDULE_TABLE1:
      ststat: SCHEDULETABLE_STOPPED
