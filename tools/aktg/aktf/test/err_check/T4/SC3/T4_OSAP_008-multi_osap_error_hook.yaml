T4_OSAP_008_multi_osap_error_hook:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    ERROR_HOOK_OSAP1:
      type: ERROR_HOOK_OSAP
      hookstat: AK_ACTIVATE
      osap: NON_TRUSTED_OSAP1
    ERROR_HOOK_OSAP2:
      type: ERROR_HOOK_OSAP
      hookstat: AK_STOP
      osap: NON_TRUSTED_OSAP1
    TASK1:
      type: TASK
      tstat: RUNNING
      osap: NON_TRUSTED_OSAP1

  do:
    id: ERROR_HOOK_OSAP1
    syssrv: ActivateTask(TASK1)
    rettype: StatusType
    retval : E_OS_CALLEVEL

  post_condition:
