T4_OSAP_001_task_not_access_resource:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type   : TASK
      tstat  : RUNNING
      inipri : TSK_PRI_MID
      curpri : TSK_PRI_HIGH
      ttype: AK_BASIC
      maxact: 2
      actcnt: 1
      relres :
        - RESOURCE1
      getres :
        - RESOURCE1
      spolicy: AK_SCHFULL
      osap: NON_TRUSTED_OSAP1

    TASK2:
      type  : TASK
      tstat : READY
      curpri: TSK_PRI_HIGH
      porder: 2
      spolicy: AK_SCHFULL
      relres :
        - RESOURCE1
      osap: TRUSTED_OSAP1

    RESOURCE1:
      type   : RESOURCE
      resprop: AK_INTERNAL
      lockflg: AK_LOCK

  do:
    id     : TASK1
    syssrv : ActivateTask(TASK1)
    rettype: StatusType
    retval : E_OK

  post_condition:
    TASK1:
      actcnt: 2
