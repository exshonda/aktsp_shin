T4_OSAP_010_error_hook_no_running_task_same_osap:
  property:
    sc: 
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: TRUSTED_OSAP1
    ERROR_HOOK_OSAP1:
      type: ERROR_HOOK_OSAP
      hookstat: AK_ACTIVATE
      osap: NON_TRUSTED_OSAP1
    INT_STATE1:
      type: INT_STATE
      istat:
        - AK_SUS_OS_INT: ERROR_HOOK_OSAP1
        - AK_SUS_ALL_INT: ERROR_HOOK_OSAP1

  do:
    id: ERROR_HOOK_OSAP1
    syssrv: DisableAllInterrupts()

  post_condition:
    INT_STATE1:
      istat:
        - AK_SUS_OS_INT: ERROR_HOOK_OSAP1
        - AK_SUS_ALL_INT: ERROR_HOOK_OSAP1
