T4_SC3_007_task_not_extended_task:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      inipri: TSK_PRI_MID
      ttype: AK_BASIC
      maxact: 2
      var:
        local:
          type: AktspTfParam
      osap: NON_TRUSTED_OSAP1
    TASK2:
      type: TASK
      tstat: WAITING
      curpri: TSK_PRI_TOP
      ttype: AK_BASIC
      maxact: 2
      osap: TRUSTED_OSAP1
    TRUSTED_FUNCTION1:
      type: TRUSTED_FUNCTION
      caller: TASK2
      waievt: EVENT1
      arg: local
      osap: TRUSTED_OSAP2
    EVENT1:
      type: EVENT

  do:
    id: TRUSTED_FUNCTION1
    syssrv: ActivateTask(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
