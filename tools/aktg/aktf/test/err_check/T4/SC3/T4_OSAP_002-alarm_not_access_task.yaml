T4_OSAP_002_alarm_not_access_task:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      var:
        galm:
          type: AlarmBaseType
      osap: TRUSTED_OSAP1
    TASK2:
      type: TASK
      tstat: SUSPENDED
      osap: TRUSTED_OSAP1
    ALARM1:
      type: ALARM
      almact: AK_ALM_ATSK
      counter: COUNTER1
      astat: AK_UNSET
      task: TASK2
      osap: NON_TRUSTED_OSAP1
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 20
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
      osap: NON_TRUSTED_OSAP1

  do:
    id: TASK1
    syssrv: GetAlarmBase(ALARM1, &galm)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK1:
      var:
        galm:
          maxallowedvalue: 20
          ticksperbase: 1
          mincycle: 1
