T4_SC3_003_caller_c2isr_stop:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_TOP
      ttype: AK_BASIC
      maxact: 2
      osap: NON_TRUSTED_OSAP1
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_LOW
      iniintpri: INT_PRI_LOW
      rtnstat: AK_STOP
      istat: AK_ENABLE
      var:
        local:
          type: AktspTfParam
      osap: TRUSTED_OSAP1
    TRUSTED_FUNCTION1:
      type: TRUSTED_FUNCTION
      caller: C2ISR1
      arg: local
      osap: TRUSTED_OSAP2

  do:
    id: TRUSTED_FUNCTION1
    syssrv: "return E_OK"
    gcov: false

  post_condition:
    TRUSTED_FUNCTION1:
      caller:
    C2ISR1:
      rtnstat: AK_ACTIVATE
