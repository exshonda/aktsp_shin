T4_044_not_event_of_alarm_event:
  property:
    sc: 

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    TASK2:
      type: TASK
      tstat  : WAITING
      curpri : TSK_PRI_HIGH
      curevt: 0
      waievt : EVT1
      relevt:
        - EVT1
    ALARM1:
      type: ALARM
      almact: AK_ALM_SEVT
      counter: COUNTER1
      astat: AK_SET
      almval: 10
      cycle: 0
      task: TASK2
      event: EVT2
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 20
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
    EVT1:
      type: EVENT
    EVT2:
      type: COUNTER
      mincyc: 1
      maxval: 20
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE

  do:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    repeat: 10
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK1:
      tstat: READY
    TASK2:
      curevt: EVT1
      tstat: RUNNING
    ALARM1:
      astat: AK_UNSET
    COUNTER1:
      curval: 10
      cstat: AK_CS_DOING
