T4_092_startuphook_activate_ststat_running:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
    STARTUP_HOOK1:
      type: STARTUP_HOOK
      hookstat: AK_ACTIVATE
      var:
        vname1:
          type: ScheduleTableStatusType
          global: true
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: ANY_CURVAL_A
      cstat: AK_CS_NULL
    SCHEDULE_TABLE1:
      type: SCHEDULE_TABLE
      counter: COUNTER1
      syncstrategy: AK_NONE
      repeat: AK_TRUE
      ststat: SCHEDULETABLE_RUNNING
      curval: 0
      duration: ANY_SCDLTBL_DURATION_A
      expoint:
        ANY_SCDLTBL_INIT_OFFSET_A:
          acttsk:
            - TASK1
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM

  do_0:
    id: STARTUP_HOOK1
    syssrv: GetScheduleTableStatus(SCHEDULE_TABLE1,&vname1)
    rettype: StatusType
    retval: E_OS_CALLEVEL
    gcov: true

  post_condition_0:
    STARTUP_HOOK1:
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM
    ERROR_HOOK1:
      hookstat: AK_ACTIVATE

  do_1:
    id: ERROR_HOOK1
    syssrv: CheckAssert(Error==E_OS_CALLEVEL)
    gcov: false

  post_condition_1:

  do_2:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_GetScheduleTableStatus_ScheduleTableID()==SCHEDULE_TABLE1)
    gcov: false

  post_condition_2:

  do_3:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_GetScheduleTableStatus_ScheduleStatus()==&vname1)
    gcov: false

  post_condition_3:

  do_4:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSErrorGetServiceId()==OSServiceId_GetScheduleTableStatus)
    gcov: false

  post_condition_4:
