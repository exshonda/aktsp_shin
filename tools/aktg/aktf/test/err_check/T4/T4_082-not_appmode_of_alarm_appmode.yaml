T4_082_not_appmode_of_alarm_appmode:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
    ALARM1:
      type: ALARM
      almact: AK_ALM_ATSK
      counter: COUNTER1
      astat: AK_SET
      almval: 5
      cycle: 0
      task: TASK2
      appmode:
        - APPLICATION_MODE1
      autostarttype: AK_ABSOLUTE
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
    APPLICATION_MODE1:
      type: EVENT

  do:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    repeat: 5
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK1:
      tstat: READY
    TASK2:
      tstat: RUNNING
      curpri: TSK_PRI_HIGH
      actcnt: 1
    ALARM1:
      astat: AK_UNSET
    COUNTER1:
      curval: 5
      cstat: AK_CS_DOING
