T4_046_no_counter_of_alarm_incounter:
  property:
    sc: 

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_SET
      almval: 3
      cycle: 0
      incounter: COUNTER2
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      ctype: AK_SOFTWARE

  do:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    repeat: 3
    rettype: StatusType
    retval: E_OK

  post_condition:
    ALARM1:
      astat: AK_UNSET
    COUNTER1:
      curval: 3
