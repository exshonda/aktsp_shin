T4_096_pre_condition_startuphook_stop:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
    C1ISR1:
      type: C1ISR
      intno: INTNO_SELF_C1ISR_MID
      iniintpri: INT_PRI_ISR1_MID
      rtnstat: AK_ACTIVATE
    STARTUP_HOOK1:
      type: STARTUP_HOOK
      hookstat: AK_STOP

  do:
    id: STARTUP_HOOK1
    syssrv: ActivateTask(TASK1)
    rettype: StatusType
    retval: E_OS_CALLEVEL

  post_condition:
