T4_094_shutdownhook_active_tstat_running:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    SHUTDOWN_HOOK1:
      type: SHUTDOWN_HOOK
      hookstat: AK_ACTIVATE
    TASK1:
      type: TASK
      tstat: RUNNING
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM

  do:
    id: SHUTDOWN_HOOK1
    syssrv: ActivateTask(TASK1)
    rettype: StatusType
    retval: E_OS_CALLEVEL

  post_condition:
