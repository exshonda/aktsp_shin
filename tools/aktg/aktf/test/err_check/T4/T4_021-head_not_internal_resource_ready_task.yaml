T4_021_head_not_internal_resource_ready_task:
  property:
    sc: 

  pre_condition:
    TASK1:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
    TASK2:
      type: TASK
      tstat: RUNNING
      inipri: TSK_PRI_BOTTOM
      curpri: TSK_PRI_MID
      actcnt: 1
      relres:
        - RESOURCE1
        - RESOURCE2
      getres:
        - RESOURCE2
        - RESOURCE1
    TASK3:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
      relres:
        - RESOURCE1
    TASK4:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_LOW
      relres:
        - RESOURCE2
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_LOCK
    RESOURCE2:
      type: RESOURCE
      resprop: AK_INTERNAL
      lockflg: AK_LOCK

  do:
    id: TASK2
    syssrv: ActivateTask(TASK1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK1:
      tstat: RUNNING
      actcnt: 1
      curpri: TSK_PRI_HIGH
    TASK2:
      tstat: READY
      getres:
        - RESOURCE1
        - RESOURCE2
