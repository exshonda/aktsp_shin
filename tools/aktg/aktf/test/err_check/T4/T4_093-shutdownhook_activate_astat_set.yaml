T4_093_shutdownhook_activate_astat_set:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
    SHUTDOWN_HOOK1:
      type: SHUTDOWN_HOOK
      hookstat: AK_ACTIVATE
      var:
        vname1:
          type: AlarmBaseType
          global: true
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_SET
      almval: ANY_ALMVAL_A
      cycle: ANY_ALMCYCLE_A
      incounter: COUNTER2
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: 0
      cstat: AK_CS_NULL
    COUNTER2:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_B
      maxval: ANY_MAXVAL_B
      curval: 0
      cstat: AK_CS_NULL

  do_0:
    id: SHUTDOWN_HOOK1
    syssrv: GetAlarmBase(ALARM1,&vname1)
    rettype: StatusType
    retval: E_OS_CALLEVEL
    gcov: true

  post_condition_0:
    SHUTDOWN_HOOK1:
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM
    ERROR_HOOK1:
      hookstat: AK_ACTIVATE

  do_1:
    id: ERROR_HOOK1
    syssrv: CheckAssert(Error==E_OS_CALLEVEL)
    gcov: false

  post_condition_1:

  do_2:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_GetAlarmBase_AlarmID()==ALARM1)
    gcov: false

  post_condition_2:

  do_3:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_GetAlarmBase_Info()==&vname1)
    gcov: false

  post_condition_3:

  do_4:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSErrorGetServiceId()==OSServiceId_GetAlarmBase)
    gcov: false

  post_condition_4:
