T4_MC_002_alarm_counter_different_coreid:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_SELF_CORE
    TASK2:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      spolicy: AK_SCHFULL
      osap: OSAP_OTHER_OTHER_CORE
    TASK3:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      osap: OSAP_OTHER_OTHER_CORE
    ALARM1:
      type: ALARM
      almact: AK_ALM_ATSK
      counter: COUNTER1
      astat: AK_SET
      almval: 5
      cycle: 0
      task: TASK3
      osap: OSAP_OTHER_OTHER_CORE
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
      osap: OSAP_SELF_CORE

  do:
    id: TASK2
    syssrv: IncrementCounter(COUNTER1)
    repeat: 5
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK2:
      tstat: READY
    TASK3:
      tstat: RUNNING
      curpri: TSK_PRI_HIGH
      actcnt: 1
    ALARM1:
      astat: AK_UNSET
    COUNTER1:
      curval: 5
      cstat: AK_CS_DOING
