T4_MC_015_lockflg_not_lock:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_SELF_CORE
    TASK2:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_HIGH
      relres:
        - RESOURCE1
      osap: OSAP_OTHER_OTHER_CORE
    C2ISR1:
      type: C2ISR
      intno: INTNO_OTHER_ISR2_C
      iniintpri: INT_PRI_MID
      rtnstat: AK_STOP
      relres:
        - RESOURCE1
      osap: OSAP_OTHER_OTHER_CORE
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
    SPINLOCK1:
      type : SPINLOCK
      lockflg: AK_LOCK

  do:
    id: TASK2
    syssrv: GetResource(RESOURCE1)
    rettype: StatusType
    retval:  E_OK

  post_condition:
    TASK2:
      curpri: INT_PRI_MID
      getres:
        - RESOURCE1
    RESOURCE1:
      lockflg: AK_LOCK
