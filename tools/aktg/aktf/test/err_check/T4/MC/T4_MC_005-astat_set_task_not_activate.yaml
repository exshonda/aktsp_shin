T4_MC_005_astat_set_task_not_activate:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_SELF_CORE
      var:
        vname1:
          type: TickType
    TASK4:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
      osap: OSAP_OTHER_OTHER_CORE
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_SET
      almval: 1
      cycle: 5
      incounter: COUNTER2
      osap: OSAP_OTHER_OTHER_CORE
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: 2
      maxval: 10
      curval: 0
      cstat: AK_CS_NULL
      osap: OSAP_OTHER_OTHER_CORE
    COUNTER2:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: 1
      maxval: ANY_MAXVAL_B
      curval: 0
      cstat: AK_CS_NULL
      osap: OSAP_OTHER_OTHER_CORE

  do:
    id: TASK1
    syssrv: GetAlarm(ALARM1,&vname1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK1:
      var:
        vname1:
          value: ANY_CURVAL_NOT_MAX_A+1
