T4_MC_006_ststat_running_task_not_activate:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
      relevt:
        - EVENT1
      osap: OSAP_OTHER_OTHER_CORE
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      osap: OSAP_OTHER_OTHER_CORE
    TASK3:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      osap: OSAP_OTHER_OTHER_CORE
    TASK4:
      type: TASK
      tstat: READY
      curpri: TSK_PRI_LOW
      relevt:
        - EVENT2
      osap: OSAP_OTHER_OTHER_CORE
    TASK5:
      type: TASK
      tstat: RUNNING
      osap: OSAP_SELF_CORE
    SCHEDULE_TABLE1:
      type: SCHEDULE_TABLE
      counter: COUNTER1
      repeat: AK_TRUE
      duration: 20
      syncstrategy: AK_NONE
      ststat: SCHEDULETABLE_RUNNING
      curval: 3
      expoint:
        5:
          acttsk:
            - TASK2
          setevt:
            - TASK1: EVENT1
        10:
          acttsk:
            - TASK3
        15:
          setevt:
            - TASK4: EVENT2
      osap: OSAP_OTHER_OTHER_CORE
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 0
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
      osap: OSAP_OTHER_OTHER_CORE
    EVENT1:
      type: EVENT
    EVENT2:
      type: EVENT

  do:
    id: TASK5
    syssrv: StopScheduleTable(SCHEDULE_TABLE1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    SCHEDULE_TABLE1:
      ststat: SCHEDULETABLE_STOPPED
