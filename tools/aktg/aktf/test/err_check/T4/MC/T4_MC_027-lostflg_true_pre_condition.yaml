T4_MC_027_lostflg_true_pre_condition:
  property:
    sc:
      - SC1

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_SELF_CORE
      var:
        in:
          type: uint8
          value: DATA_UINT8_D
    TASK2:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_OTHER_OTHER_CORE
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM
        - AK_BOTH
      coreid: CORE_SELF
    IOC0:
      type: IOC
      sender:
        - SENDER0
      receiver: RECEIVER
      iocdata:
        - IOC0_DATA0
      maxque: 3
      datalist:
        -
         - IOC0_DATA0: DATA_UINT8_A
        -
         - IOC0_DATA0: DATA_UINT8_B
        -
         - IOC0_DATA0: DATA_UINT8_C
      lostflg: true
    SENDER0:
      type: IOC_SENDER
      senderid: 0
      kind: AK_FUNCTION
      osap: OSAP_SELF_CORE
    RECEIVER:
      type: IOC_RECEIVER
      kind: AK_FUNCTION
      osap: OSAP_OTHER_OTHER_CORE
    IOC0_DATA0:
      type: IOC_DATA
      datatype: uint8

  do_0:
    id: TASK1
    syssrv: IocSend_IOC0(in)
    rettype: Std_ReturnType
    retval: IOC_E_LIMIT

  post_condition_0:
    ERROR_HOOK1:
      hookstat: AK_ACTIVATE
    IOC0:
      datalist:
        -
         - IOC0_DATA0: DATA_UINT8_A
        -
         - IOC0_DATA0: DATA_UINT8_B
        -
         - IOC0_DATA0: DATA_UINT8_C
      lostflg: true

  do_1:
    id: ERROR_HOOK1
    syssrv: CheckAssert(Error==IOC_E_LIMIT)

  post_condition_1:

  do_2:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_IocSend_IocId()==IOC0)

  post_condition_2:

  do_3:
    id: ERROR_HOOK1
    syssrv: CheckAssert(OSError_IocSend_SenderId()==0)

  post_condition_3:
