T4_090_startuphook_activate_and_task_running:
  property:
    need_stack_share: true
    sc: 
      - SC1
    application_mode: APPLICATION_MODE1

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      appmode:
        - APPLICATION_MODE1
    STARTUP_HOOK1:
      type: STARTUP_HOOK
      hookstat: AK_ACTIVATE
    SHUTDOWN_HOOK1:
      type: SHUTDOWN_HOOK
      hookstat: AK_STOP
    APPLICATION_MODE1:
      type: APPLICATION_MODE
    APPLICATION_MODE2:
      type: APPLICATION_MODE

  do_0:
    id: STARTUP_HOOK1
    syssrv: return

  post_condition_0:
    STARTUP_HOOK1:
      hookstat: AK_STOP

  do_1:
    id: TASK1
    syssrv: ShutdownOS(E_OK)

  post_condition_1:
    SHUTDOWN_HOOK1:
      hookstat: AK_ACTIVATE
