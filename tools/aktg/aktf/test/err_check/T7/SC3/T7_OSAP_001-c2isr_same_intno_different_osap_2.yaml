T7_OSAP_001_c2isr_same_intno_different_osap_2:
  property:
    sc: 
      - SC3
      - SC4
    need_enadis_interrupt_source: true

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: TRUSTED_OSAP1
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_LOW
      iniintpri: INT_PRI_LOW
      rtnstat: AK_ACTIVATE
      osap: TRUSTED_OSAP2
    C2ISR2:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_D
      iniintpri: INT_PRI_MID
      rtnstat: AK_STOP
      osap: TRUSTED_OSAP1
      istat: AK_DISABLE
    INT_STATE1:
      type: INT_STATE
      istat:
        - AK_DIS_ALL_INT: C2ISR1

  do_0:
    id: C2ISR1
    syssrv: DisableInterruptSource(C2ISR2)
    rettype: StatusType
    retval: E_OK
    gcov: true

  post_condition_0:
    C2ISR2:
      istat: AK_DISABLE

  do_1:
    id: C2ISR1
    syssrv: AktspRaiseInterrupt(INTNO_SELF_C2ISR_MID_D)
    gcov: false

  post_condition_1:

  do_2:
    id: C2ISR1
    syssrv: EnableInterruptSource(C2ISR2)
    rettype: StatusType
    retval: E_OK
    gcov: false

  post_condition_2:
    C2ISR2:
      istat: AK_ENABLE

  do_3:
    id: C2ISR1
    syssrv: EnableAllInterrupts()

  post_condition_3:
    C2ISR1:
      rtnstat: AK_STOP
    C2ISR2:
      rtnstat: AK_ACTIVATE
      istat: AK_ENABLE
    INT_STATE1:
      istat:
