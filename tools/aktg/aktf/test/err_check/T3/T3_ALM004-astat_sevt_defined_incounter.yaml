T3_ALM004_astat_sevt_defined_incounter:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    TASK2:
      type: TASK
      tstat: WAITING
      ttype: AK_EXTENDED
      curpri: TSK_PRI_MID
      curevt: 0
      relevt:
        - EVENT1
      waievt: EVENT1
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_ISR2_A
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
    ALARM1:
      type: ALARM
      almact: AK_ALM_SEVT
      counter: COUNTER1
      astat: AK_SET
      almval: 0
      cycle: 0
      event: EVENT1
      task: TASK1
      incounter: COUNTER1
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: ANY_CURVAL_NOT_0_MAX_A
      cstat: AK_CS_NULL
    EVENT1:
      type: EVENT

  do:
    id: C2ISR1
    syssrv: IncrementCounter(COUNTER1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    COUNTER1:
      curval: ANY_CURVAL_NOT_0_MAX_A+1
