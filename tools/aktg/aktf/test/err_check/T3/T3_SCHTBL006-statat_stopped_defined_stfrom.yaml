T3_SCHTBL006_statat_stopped_defined_stfrom:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    TASK2:
      type: TASK
      tstat: WAITING
      curpri: TSK_PRI_HIGH
      waievt: EVENT1
      relevt:
        - EVENT1
    TASK3:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      maxact: 3
    TASK4:
      type: TASK
      tstat: READY
      curpri: TSK_PRI_LOW
      maxact: 2
      actcnt: 1
    SCHEDULE_TABLE1:
      type: SCHEDULE_TABLE
      counter: COUNTER1
      repeat: AK_TRUE
      duration: 5
      syncstrategy: AK_NONE
      ststat: SCHEDULETABLE_RUNNING
      curval: 1
      expoint:
        2:
          setevt:
            - TASK2: EVENT1
    SCHEDULE_TABLE2:
      type: SCHEDULE_TABLE
      counter: COUNTER1
      repeat: AK_TRUE
      duration: 15
      syncstrategy: AK_NONE
      ststat: SCHEDULETABLE_STOPPED
      expoint:
        5:
          acttsk:
            - TASK4
        10:
          acttsk:
            - TASK3
    COUNTER1:
      type: COUNTER
      mincyc: 1
      maxval: 10
      curval: 3
      cstat: AK_CS_NULL
      ctype: AK_SOFTWARE
    EVENT1:
      type: EVENT

  do_0:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    rettype: StatusType
    retval: E_OK
    gcov: false

  post_condition_0:
    TASK1:
      tstat: READY
    TASK2:
      tstat: RUNNING
      curpri: TSK_PRI_HIGH
      actcnt: 1
      curevt: EVENT1
    SCHEDULE_TABLE1:
      curval: 2
    COUNTER1:
      curval: 4
      cstat: AK_CS_DOING

  do_1:
    id: TASK2
    syssrv: TerminateTask()
    gcov: false

  post_condition_1:
    TASK1:
      tstat: RUNNING
    TASK2:
      tstat: SUSPENDED
    COUNTER1:
      cstat: AK_CS_NULL

  do_2:
    id: TASK1
    syssrv: NextScheduleTable(SCHEDULE_TABLE1, SCHEDULE_TABLE2)
    rettype: StatusType
    retval: E_OK
    gcov: true

  post_condition_2:
    SCHEDULE_TABLE2:
      ststat: SCHEDULETABLE_NEXT
      stfrom: SCHEDULE_TABLE1

  do_3:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    repeat: 3
    rettype: StatusType
    retval: E_OK
    gcov: false

  post_condition_3:
    COUNTER1:
      curval: 7
    SCHEDULE_TABLE1:
      ststat: SCHEDULETABLE_STOPPED
      stfrom: SCHEDULE_TABLE2
    SCHEDULE_TABLE2:
      ststat: SCHEDULETABLE_RUNNING
      curval: 0

  do_4:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    repeat: 5
    rettype: StatusType
    retval: E_OK
    gcov: false

  post_condition_4:
    TASK4:
      actcnt: 2
    SCHEDULE_TABLE2:
      curval: 5
    COUNTER1:
      curval: 1
