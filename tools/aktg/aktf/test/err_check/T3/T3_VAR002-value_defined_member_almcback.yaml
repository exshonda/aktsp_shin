T3_VAR002_value_defined_member_almcback:
  property:
    sc: 
      - SC1

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      spolicy: AK_SCHFULL
      ttype: AK_BASIC
    ALARM1:
      type: ALARM
      almact: AK_ALM_CBACK
      counter: COUNTER1
      astat: AK_SET
      almval: ANY_ALMVAL_A
      cycle: 0
      callback: ALARM_CBACK1
    COUNTER1:
      type: COUNTER
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: ANY_ALMVAL_A-1
      ctype: AK_SOFTWARE
      cstat: AK_CS_NULL
    ALARM_CBACK1:
      type: ALARM_CBACK
      cbstat: AK_STOP
      var:
        vname1:
          type: TaskType
          value: 0

  do:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    COUNTER1:
      curval: ANY_ALMVAL_A
      cstat: AK_CS_DOING
    ALARM1:
      astat: AK_UNSET
    ALARM_CBACK1:
      cbstat: AK_ACTIVATE
      var:
        vname1:
          maxallowedvalue: ANY_MAXVAL_A
