T3_ALM007_astat_unset_defined_cycle:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_ISR2_A
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_UNSET
      incounter: COUNTER2
      cycle: 0
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: 1
      maxval: ANY_MAXVAL_A
      curval: ANY_MAXVAL_A
      cstat: AK_CS_NULL
    COUNTER2:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: 1
      maxval: ANY_MAXVAL_B
      curval: 0
      cstat: AK_CS_NULL

  do:
    id: C2ISR1
    syssrv: CancelAlarm(ALARM1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    ALARM1:
      astat: AK_UNSET
