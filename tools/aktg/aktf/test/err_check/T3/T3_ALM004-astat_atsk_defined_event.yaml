T3_ALM004_astat_atsk_defined_event:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_MID
    ALARM1:
      type: ALARM
      almact: AK_ALM_ATSK
      counter: COUNTER1
      astat: AK_SET
      almval: ANY_MAXVAL_A-1
      cycle: 0
      task: TASK1
      event: EVENT1
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: ANY_MAXVAL_A
      cstat: AK_CS_NULL

  do:
    id: TASK1
    syssrv: IncrementCounter(COUNTER1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    COUNTER1:
      curval: 0
