T3_SC3_RES001_defined_accosap:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      relres:
        - RESOURCE1
      osap: TRUSTED_OSAP1
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri: TSK_PRI_HIGH
      relres:
        - RESOURCE1
      osap: NON_TRUSTED_OSAP1
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK
      accosap:
        - NON_TRUSTED_OSAP1
    RESOURCE2:
      type: RESOURCE
      resprop: AK_LINKED
      lockflg: AK_UNLOCK
      linkres: RESOURCE1
      accosap:
        - NON_TRUSTED_OSAP1

  do_0:
    id: TASK1
    syssrv: GetResource(RESOURCE1)
    rettype: StatusType
    retval: E_OK
    gcov: true

  post_condition_0:
    TASK1:
      curpri: TSK_PRI_HIGH
      getres:
        - RESOURCE1
    RESOURCE1:
      lockflg: AK_LOCK

  do_1:
    id: TASK1
    syssrv: GetResource(RESOURCE2)
    rettype: StatusType
    retval: E_OK
    gcov: true

  post_condition_1:
    TASK1:
      getres:
        - RESOURCE1
        - RESOURCE2

    RESOURCE2:
      lockflg: AK_LOCK
