T3_SC3_TSK002_stack_share_false_defined_sstak:
  property:
    sc:
      - SC3
      - SC4
# configure.yamlのstack_shareをfalseにしてください

  pre_condition:
    TASK1:
      type   : TASK
      tstat  : RUNNING
      curpri : TSK_PRI_TOP
      ttype: AK_BASIC
      maxact: 2
      sstk: aktg_sstack_1
      osap: NON_TRUSTED_OSAP1

  do:
    id     : TASK1
    syssrv : ActivateTask(TASK1)
    rettype: StatusType
    retval : E_OK
    gcov   : true

  post_condition:
    TASK1:
      actcnt: 2
