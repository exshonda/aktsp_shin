      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      spolicy: AK_SCHFULL
      ttype: AK_BASIC
      var:
        vname1:
          type: TaskType
          value: 0
    INT_STATE1:
      type: INT_STATE
      istat:
        - AK_SUS_ALL_INT: TASK1

  do:
    id: TASK1
    syssrv: GetTaskID(&vname1)
    rettype: StatusType
    retval: E_OS_DISABLEDINT

  post_condition:
    TASK1:
      var:
        vname1:
          maxallowedvalue: ANY_MAXVAL_A
