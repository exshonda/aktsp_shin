T3_VAR002_value_defined_member_c2isr:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_ISR2_A
      iniintpri: INT_PRI_MID
      var:
        vname1:
          type: TickType
      rtnstat: AK_ACTIVATE
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_SET
      almval: ANY_CURVAL_NOT_0_MAX_A
      cycle: 0
      incounter: COUNTER2
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: 0
      cstat: AK_CS_NULL
    COUNTER2:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: 1
      maxval: ANY_MAXVAL_B
      curval: 0
      cstat: AK_CS_NULL

  do:
    id: C2ISR1
    syssrv: GetAlarm(ALARM1,&vname1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    C2ISR1:
      var:
        vname1:
          value: ANY_CURVAL_NOT_0_MAX_A
          maxallowedvalue: ANY_MAXVAL_A
