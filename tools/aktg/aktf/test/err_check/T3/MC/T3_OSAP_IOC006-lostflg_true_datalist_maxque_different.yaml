T3_OSAP_IOC006_lostflg_true_datalist_maxque_different:
  property:
    sc:
      - SC1

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_SELF_CORE
      var:
        in:
          type: uint8
          value: DATA_UINT8_D
    TASK2:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
      osap: OSAP_OTHER_OTHER_CORE
    ERROR_HOOK1:
      type: ERROR_HOOK
      hookstat: AK_STOP
      target_error_hook_cfg:
        - AK_ONLY_SYSTEM
        - AK_BOTH
      coreid: CORE_SELF
    IOC0:
      type: IOC
      sender:
        - SENDER0
      receiver: RECEIVER
      iocdata:
        - IOC0_DATA0
      maxque: 5
      datalist:
        - IOC0_DATA0: DATA_UINT8_A
        - IOC0_DATA0: DATA_UINT8_B
        - IOC0_DATA0: DATA_UINT8_C
      lostflg: false
    SENDER0:
      type: IOC_SENDER
      senderid: 0
      kind: AK_FUNCTION
      osap: OSAP_SELF_CORE
    RECEIVER:
      type: IOC_RECEIVER
      kind: AK_FUNCTION
      osap: OSAP_OTHER_OTHER_CORE
    IOC0_DATA0:
      type: IOC_DATA
      datatype: uint8

  do:
    id: TASK1
    syssrv: IocSend_IOC0(in)
    rettype: Std_ReturnType
    retval: IOC_E_LIMIT

  post_condition:
    ERROR_HOOK1:
      hookstat: AK_ACTIVATE
    IOC0:
      datalist:
        - IOC0_DATA0: DATA_UINT8_A
        - IOC0_DATA0: DATA_UINT8_B
        - IOC0_DATA0: DATA_UINT8_C
        - IOC0_DATA0: DATA_UINT8_D
      lostflg: true
