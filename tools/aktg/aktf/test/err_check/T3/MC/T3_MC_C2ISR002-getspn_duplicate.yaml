T3_MC_C2ISR002_getspn_duplicate:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri : TSK_PRI_MID
      osap: OSAP_SELF_CORE
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri : TSK_PRI_HIGH
      osap: OSAP_OTHER_OTHER_CORE
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_C
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
      getspn:
        - SPINLOCK1
        - SPINLOCK1
      osap: OSAP_SELF_CORE
    SPINLOCK1:
      type : SPINLOCK
      lockflg: AK_LOCK

  do:
    id: C2ISR1
    syssrv: ActivateTask(TASK2)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK2:
      tstat: RUNNING
      curpri : TSK_PRI_HIGH
      actcnt: 1
