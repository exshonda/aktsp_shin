T3_TSK015_inipri_greater_than_curpri:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_LOW
      inipri: TSK_PRI_HIGH
      relres:
        - RESOURCE1
      getres:
        - RESOURCE1
    TASK2:
      type  : TASK
      tstat : SUSPENDED
      inipri: TSK_PRI_LOW
      relres:
        - RESOURCE1
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_LOCK

  do:
    id: TASK1
    syssrv: ReleaseResource(-1)
    rettype: StatusType
    retval: E_OS_ID

  post_condition:
