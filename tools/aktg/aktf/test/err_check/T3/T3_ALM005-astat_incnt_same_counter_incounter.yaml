T3_ALM005_astat_incnt_same_counter_incounter:
  property:
    sc: 
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri: TSK_PRI_MID
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_ISR2_A
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
    ALARM1:
      type: ALARM
      almact: AK_ALM_INCNT
      counter: COUNTER1
      astat: AK_SET
      almval: 0
      cycle: 0
      incounter: COUNTER1
    COUNTER1:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_A
      maxval: ANY_MAXVAL_A
      curval: ANY_MAXVAL_A
      cstat: AK_CS_NULL
    COUNTER2:
      type: COUNTER
      ctype: AK_SOFTWARE
      mincyc: ANY_MINCYC_B
      maxval: ANY_MAXVAL_B
      curval: 0
      cstat: AK_CS_NULL

  do:
    id: C2ISR1
    syssrv: IncrementCounter(COUNTER1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    ALARM1:
      astat: AK_UNSET
    COUNTER1:
      curval: 0
    COUNTER2:
      curval: 1
