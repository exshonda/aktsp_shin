T5_M001_tstat_running_waitspin_precondition:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      osap: OSAP_SELF_CORE
    TASK2:
      type: TASK
      tstat: AK_RUNNING_WAITSPIN
      spnid: SPINLOCK1
      osap: OSAP_OTHER_OTHER_CORE
    SPINLOCK1:
      type: SPINLOCK
      susint: AK_SUS_ALL_SPN
      lockflg: AK_UNLOCK
      accosap:
        - OSAP_SELF_CORE
        - OSAP_OTHER_OTHER_CORE
    INT_STATE1:
      type: INT_STATE
      istat:
      coreid: CORE_SELF
    INT_STATE2:
      type: INT_STATE
      istat:
      coreid: CORE_OTHER

  do:
    id: TASK1
    syssrv: GetSpinlock(SPINLOCK1)
    rettype: StatusType
    retval : E_OK
    gcov: true

  post_condition:
    TASK1:
      getspn:
        - SPINLOCK1
    SPINLOCK1:
      lockflg: AK_LOCK
    INT_STATE1:
      istat:
        - AK_SUS_ALL_INT: SPINLOCK1
