T5_006_c2isr_intatr_disable:
  property:
    sc: 
    need_enadis_interrupt_source: true
# configure.yamlのsupport_enadis_interrupt_sourceはfalseにしてください

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_B
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
      intatr: AK_DISABLE
      relres:
        - RESOURCE1
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK

  do:
    id: C2ISR1
    syssrv: GetResource(RESOURCE1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    C2ISR1:
      getres:
        - RESOURCE1
    RESOURCE1:
      lockflg: AK_LOCK
