shutdown_hook_pre_stop:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    SHUTDOWN_HOOK1:
      type: SHUTDOWN_HOOK
      hookstat: AK_STOP
    TASK1:
      type   : TASK
      tstat  : RUNNING
      curpri : TSK_PRI_MID
      ttype: AK_BASIC
      maxact: 2
      osap: TRUSTED_OSAP1
    INT_STATE1:
      type: INT_STATE
      istat:

  do:
    id: TASK1
    syssrv: SuspendAllInterrupts()

  post_condition:
    INT_STATE1:
      istat:
        - AK_SUS_ALL_INT: TASK1
