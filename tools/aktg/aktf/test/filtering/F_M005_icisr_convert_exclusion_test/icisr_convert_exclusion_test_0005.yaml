icisr_convert_exclusion_test_0005:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri : TSK_PRI_MID
      osap: TR_OSAP_SELF_CORE
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_LOW
      iniintpri: INT_PRI_LOW
      rtnstat: AK_STOP
      osap: TR_OSAP_SELF_CORE
    INT_STATE1:
      type: INT_STATE
      istat:
        - AK_SUS_ALL_INT: TASK1

  do:
    id: TASK1
    syssrv: AktspRaiseInterrupt(INTNO_SELF_C2ISR_MID_A)

  post_condition:
    C2ISR1:
      rtnstat: AK_ACTIVATE
