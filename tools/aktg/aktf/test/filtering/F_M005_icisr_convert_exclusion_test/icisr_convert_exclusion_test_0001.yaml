icisr_convert_exclusion_test_0001:
  property:
    sc:
      - SC3
      - SC4

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri : TSK_PRI_MID
      osap: TR_OSAP_SELF_CORE
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri : TSK_PRI_HIGH
      osap: NT_OSAP_OTHER_OTHER_CORE
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_A
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE
      osap: TR_OSAP_SELF_CORE

  do:
    id: C2ISR1
    syssrv: ActivateTask(TASK2)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK2:
      tstat: RUNNING
      curpri : TSK_PRI_HIGH
      actcnt: 1
