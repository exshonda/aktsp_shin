intno_invalid:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
      curpri : TSK_PRI_MID
    TASK2:
      type: TASK
      tstat: SUSPENDED
      inipri : TSK_PRI_HIGH
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_MID_C
      iniintpri: INT_PRI_MID
      rtnstat: AK_ACTIVATE

  do:
    id: C2ISR1
    syssrv: ActivateTask(TASK2)
    rettype: StatusType
    retval: E_OK

  post_condition:
    TASK2:
      tstat: READY
      curpri : TSK_PRI_HIGH
      actcnt: 1
