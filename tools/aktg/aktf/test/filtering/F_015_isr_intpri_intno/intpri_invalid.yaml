intpri_invalid:
  property:
    sc:
      - SC1
      - SC2

  pre_condition:
    TASK1:
      type: TASK
      tstat: RUNNING
    C2ISR1:
      type: C2ISR
      intno: INTNO_SELF_C2ISR_HIGH
      iniintpri: INT_PRI_HIGH
      rtnstat: AK_ACTIVATE
      relres:
        - RESOURCE1
    RESOURCE1:
      type: RESOURCE
      resprop: AK_STANDARD
      lockflg: AK_UNLOCK

  do:
    id: C2ISR1
    syssrv: GetResource(RESOURCE1)
    rettype: StatusType
    retval: E_OK

  post_condition:
    C2ISR1:
      getres:
        - RESOURCE1
    RESOURCE1:
      lockflg: AK_LOCK
