version: "$Id: ActivateTask_E_b.yaml 2 2014-04-15 07:29:16Z fsi-dankei $"
ActivateTask_E_b:
  variation:
    cc: ECC1 | ECC2
    ts: COS
    si:
      - OS097
      - NOS999

  pre_condition:
    TASK1:
      type  : TASK
      tstat : RUNNING
      relevt:
        - EVT1

    EVT1:
      type: EVENT

  do:
    id     : TASK1
    syssrv : ActivateTask(TASK1)
    rettype: StatusType
    retval : E_OS_LIMIT

  post_condition:

