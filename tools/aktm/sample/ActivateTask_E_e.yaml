version: "$Id: ActivateTask_E_e.yaml 2 2014-04-15 07:29:16Z fsi-dankei $"
ActivateTask_E_e:
  variation:
    cc: BCC1 | ECC1
    ts: COS
    si:
      - OS301
      - OS266

  pre_condition:
    TASK1:
      type : TASK
      tstat: RUNNING

    TASK2:
      type   : TASK
      tstat  : READY
      tsktype: BASIC

  do:
    id     : TASK1
    syssrv : ActivateTask(TASK2)
    rettype: StatusType
    retval : E_OS_LIMIT

  post_condition:

