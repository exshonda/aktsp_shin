executer_module: executer_nios2_blaster.rb

max_threads: 3
use_force_merge: true
use_divide_force_merge : true
divide_force_merge_config_file : /library/target/nios2_dev_gcc/force_merge_divnum.dat

scalability_class: SC3
core_num: 1
use_multi_core: false
use_kernel_lib: false
average_manifest: true

use_auto_code: false
use_force_merge: true
use_divide_force_merge : true
divide_force_merge_config_file : /library/target/nios2_dev_gcc/force_merge_divnum.dat

# for configure
use_hwcounter: true
use_application_name: true
application_name: out
use_configuration_name: true
configuration_name: 
 - out
 - aktsp_implementation_data_types
use_other_library: true
other_library: 
 - aktsp_common_lib.o
 - aktsp_implement_lib.o
 - aktsp_target_lib.o
use_compile_option: true
compile_option: 
 - -DINTPRI_ICI0=3
 - -DINTPRI_ICI1=3
 - -DENABLE_RETURN_MAIN
use_symbol_definition_option: true
symbol_definition_option:
 - -DOTHER_PRC_SVC_TABLE=aktsp_add_syssrv.h
include_target:
 - library/common
 - library/implement/atk2
 - library/target/nios2_dev_gcc
 - .

# for AKTG
tool_aktg_bin: /tools/aktg/bin/aktg.rb
aktg_stack_monitoring: true
aktg_stackfault_detection: false 
aktg_stack_share: true 
aktg_use_get_serviceid: true 
aktg_use_parameter_access: false
aktg_return_status: EXTENDED

kernel_path: ../atk2-sc3
target_name: nios2_dev_gcc

obj_root_path: /obj/error_test
obj_tesry_path: /obj/tesry/error_test
obj_manifest_path: /obj/error_test/MANIFEST_AUTO_CODE
obj_auto_path: /obj/error_test/auto_code
cmy_path: /tesrys/error_test/sc3/illegal_terminate_hook/notmerge_tesry/*.cmy
auto_dir_ladder: ../../../

target_bin: atk2-sc3.srec

target_exec_cmd: nios2-gdb-server.exe --cable=USB-Blaster --instance=0 --no-verify -r --go 
target_log_cmd: nios2-terminal --cable=USB-Blaster --instance=0 -q

max_exec_time: 500
