executer_module: executer_nios2_mc.rb
downloader_module: downloader_nios2_mc_blaster.rb
#downloader_module: downloader_nios2_mc_uart.rb

divide_num: 1
max_threads: 1

scalability_class: SC3
core_num: 2
use_multi_core: true
use_kernel_lib: false
average_manifest: false

use_auto_code: true

# for configure
use_hwcounter: true
use_application_name: true
application_name: out
use_configuration_name: true
configuration_name: 
 - out
 - aktsp_implementation_data_types
use_other_library: true
other_library: 
 - aktsp_common_lib.o
 - aktsp_implement_lib.o
 - aktsp_target_lib.o
use_compile_option: true
compile_option: 
 - -DINTPRI_ICI0=3
 - -DINTPRI_ICI1=3
use_symbol_definition_option: true
symbol_definition_option:
 - -DOTHER_PRC_SVC_TABLE=aktsp_add_syssrv.h
include_target:
 - library/common
 - library/implement/atk2
 - library/target/nios2_dev_gcc
 - .

# for AKTG
tool_aktg_bin: /tools/aktg/bin/aktg.rb
aktg_func_interrupt: true
aktg_out_file_name: out
aktg_func_hardware_counter: true
aktg_func_protection_hook: true
aktg_boot_only_master_core: true
aktg_icisr_convert: true
aktg_icisr_pri: INT_PRI_MID

kernel_path: ../atk2-sc3-mc
target_name: nios2_dev_gcc

obj_root_path: /obj/sc3mc/icisr/icisr_mid-atypical-M-nios2/
obj_tesry_path: /obj/sc3mc/tesry/icisr/icisr_mid-atypical-M-nios2/
obj_manifest_path: /obj/sc3mc/icisr/icisr_mid-atypical-M-nios2/MANIFEST_AUTO_CODE
obj_auto_path: /obj/sc3mc/icisr/icisr_mid-atypical-M-nios2/auto_code
cmy_path: /tesrys/atypical_syssrv_test/sc3*/*/*/*.cmy
auto_dir_ladder: ../../../../../

target_bin: atk2-sc3-mc.srec

target_exec_cmd: nios2-gdb-server.exe --cable=USB-Blaster --instance=0 --no-verify -r --go 
target_log_cmd: nios2-terminal --cable=USB-Blaster --instance=0 -q

max_exec_time: 500
